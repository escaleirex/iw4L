apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

react {
    autolinkLibrariesWithApp()
    debuggableVariants = []
}
android {
    namespace 'org.nativecod.app'
    ndkVersion rootProject.ext.ndkVersion
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId 'org.nativecod.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('rustJniLibs')]
    sourceSets.main.assets.srcDirs += ['src/main/assets']
    buildFeatures { prefab true; buildConfig true }
    buildTypes { release { minifyEnabled false } }
}

def rustBuild = tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir.parentFile
    environment 'ANDROID_NDK_HOME', "${android.sdkDirectory}/ndk/${rootProject.ext.ndkVersion}"
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-P', '31', '-o',
        layout.buildDirectory.dir('rustJniLibs').get().asFile.absolutePath,
        'build', '--locked', '-p', 'android_runtime', '--features', 'iw4-runtime', '--profile', 'android'
    inputs.files(fileTree('../../crates') { include '**/*.rs', '**/Cargo.toml' })
    inputs.files('../../Cargo.toml', '../../Cargo.lock')
    outputs.dir(layout.buildDirectory.dir('rustJniLibs'))
}
tasks.configureEach {
    if (name.startsWith('merge') && (name.endsWith('NativeLibs') || name.endsWith('JniLibFolders'))) dependsOn rustBuild
}
dependencies {
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')
    implementation('androidx.games:games-activity:4.4.0')
    implementation('androidx.appcompat:appcompat:1.7.1')
}
